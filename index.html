<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Final</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#F1F8F6;--main:#128C7E;--me:#dcf8c6}
*{box-sizing:border-box;font-family:system-ui}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
header{background:linear-gradient(135deg,#128C7E,#0ea5a4);color:white;padding:12px;display:flex;justify-content:space-between;align-items:center}
#status{font-size:12px;opacity:.9}
.header-right{display:flex;gap:14px}
.page{display:none;height:calc(100vh - 70px);padding:10px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--main);color:white;margin:8px 0}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin:6px 0}
#messages{height:60vh;overflow-y:auto}
.msg{max-width:75%;padding:12px;margin:6px 0;border-radius:14px;background:white}
.me{background:var(--me);margin-left:auto}
/* CALL PAGE */
#callPage{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100;color:white}
#callHeader{text-align:center;padding:10px;font-size:14px}
#callMedia{flex:1;padding:6px}
video,audio{width:100%;border-radius:12px}
#callControls{display:flex;justify-content:space-around;padding:12px}
#callControls button{padding:10px 16px;border:none;border-radius:20px;background:#128C7E;color:white}
#incoming{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;color:white;align-items:center;justify-content:center;flex-direction:column;z-index:200}
</style>
</head>
<body>

<audio id="ring" loop>
  <source src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAA==" type="audio/mp3">
</audio>

<header>
  <div>
    Messenger
    <div id="status">🔴 Disconnected</div>
  </div>
  <div class="header-right" id="callBtns" style="display:none">
    <span onclick="startCall(false)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 5.18 2 2 0 0 1 5.06 3h3a2 2 0 0 1 2 1.72c.12.81.3 1.6.54 2.36a2 2 0 0 1-.45 2.11L9.1 10.91a16 16 0 0 0 4 4l1.72-1.05a2 2 0 0 1 2.11-.45c.76.24 1.55.42 2.36.54A2 2 0 0 1 22 16.92z"/></svg>
    </span>
    <span onclick="startCall(true)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2"><rect x="2" y="7" width="15" height="10" rx="2"/><polygon points="23 7 17 12 23 17 23 7"/></svg>
    </span>
  </div>
</header>

<!-- HOME -->
<div class="page" id="home">
  <button class="btn" onclick="show('add')">➕ Add Friend</button>
</div>

<!-- ADD -->
<div class="page" id="add">
  <input id="mycode" readonly>
  <button class="btn" onclick="copyCode()">Copy</button>
  <input id="friendcode" placeholder="Friend Code">
  <button class="btn" onclick="connect()">Connect</button>
</div>

<!-- CHAT -->
<div class="page" id="chat">
  <div id="messages"></div>
  <input id="text" placeholder="Type message">
  <button class="btn" onclick="send()">Send</button>
</div>

<!-- CALL PAGE -->
<div id="callPage">
  <div id="callHeader">In Call • <span id="callTime">00:00</span></div>
  <div id="callMedia"></div>
  <div id="callControls">
    <button onclick="toggleMute()">Mute</button>
    <button onclick="toggleCam()">Cam</button>
    <button onclick="endCall()" style="background:red">End</button>
  </div>
</div>

<!-- INCOMING -->
<div id="incoming">
  <h3>Incoming Call</h3>
  <button class="btn" onclick="accept()">Accept</button>
  <button class="btn" onclick="reject()">Reject</button>
</div>

<script>
let peer=new Peer();
let conn,callObj,localStream,videoCall=false;
let timer,start;

function show(p){
  document.querySelectorAll('.page').forEach(x=>x.style.display="none");
  document.getElementById(p).style.display="block";
  callBtns.style.display = p==="chat"?"flex":"none";
}
show("home");

peer.on("open",id=>mycode.value=id);

peer.on("connection",c=>{
  conn=c;
  status.innerText="🟢 Connected";
  show("chat");
});

peer.on("call",call=>{
  callObj=call;
  videoCall=call.metadata.video;
  ring.play();
  incoming.style.display="flex";
});

function connect(){
  conn=peer.connect(friendcode.value);
  status.innerText="🟢 Connected";
  show("chat");
}

function send(){
  if(!text.value)return;
  let d=document.createElement("div");
  d.className="msg me";
  d.innerText=text.value;
  messages.appendChild(d);
  if(conn)conn.send(text.value);
  text.value="";
}

function startCall(video){
  videoCall=video;
  navigator.mediaDevices.getUserMedia({audio:true,video}).then(stream=>{
    localStream=stream;
    callObj=peer.call(friendcode.value,stream,{metadata:{video}});
    openCall(stream);
  });
}

function accept(){
  ring.pause();
  navigator.mediaDevices.getUserMedia({audio:true,video:videoCall}).then(stream=>{
    localStream=stream;
    callObj.answer(stream);
    incoming.style.display="none";
    openCall(stream);
  });
}

function reject(){
  ring.pause();
  incoming.style.display="none";
  addMsg(videoCall?"📹 Missed video call":"📞 Missed audio call");
}

function openCall(stream){
  callPage.style.display="flex";
  chat.style.display="none";
  callMedia.innerHTML="";
  let l=document.createElement(videoCall?"video":"audio");
  l.srcObject=stream;
  l.autoplay=true;
  l.muted=true;
  callMedia.appendChild(l);

  callObj.on("stream",r=>{
    let rv=document.createElement(videoCall?"video":"audio");
    rv.srcObject=r;
    rv.autoplay=true;
    callMedia.appendChild(rv);
  });
  startTimer();
}

function endCall(){
  callObj.close();
  localStream.getTracks().forEach(t=>t.stop());
  callPage.style.display="none";
  show("chat");
  clearInterval(timer);
}

function toggleMute(){if(localStream)localStream.getAudioTracks()[0].enabled^=1}
function toggleCam(){let v=localStream.getVideoTracks();if(v.length)v[0].enabled^=1}

function startTimer(){
  start=Date.now();
  timer=setInterval(()=>{
    let s=Math.floor((Date.now()-start)/1000);
    callTime.innerText=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  },1000);
}

function addMsg(t){
  let d=document.createElement("div");
  d.className="msg";
  d.innerText=t;
  messages.appendChild(d);
}

function copyCode(){mycode.select();document.execCommand("copy");alert("Copied")}
</script>
</body>
</html>
